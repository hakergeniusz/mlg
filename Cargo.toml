[package]
name = "mlg"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Auto-MLG: a water bucket placed under you in the last stretch of a fall, picked back up after the landing. A Horizon native mod."
publish = false

[dependencies]
# The pinned SDK's API crate; the launcher stages its own copy of the same build.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
