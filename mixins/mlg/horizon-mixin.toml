[mod]
id = "mlg"
version = "0.1.0"
priority = 100

# The commit it was tested on: the tick hook drives the game's own use
# pipeline (game.rs), so a Horizon change there needs a re-check.
[compatibility]
horizon_revision = "2ebf00a0281c592f79191e76fce0e7d522c6f425"

# The mod's brain: pure standard library, no game types, tested on its own.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "mlg"
source = "runtime.rs"

# The save's progress, game-side: the step and the player's own slot.
[[module]]
id = "state"
file = "crates/horizon-client/src/game.rs"
name = "mlg_state"
source = "state.rs"

# Every game tick: run the save's state machine.
[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# The row in Options > Mods: the mod and what it does.
[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]
