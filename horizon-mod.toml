id = "mlg"
name = "MLG"
version = "0.2.1"
description = "Auto-MLG: places your water bucket under you in the last stretch of a fall and picks it back up once you have landed, so no fall damage registers."
authors = ["hakergeniusz"]
license = "MIT"
api = "0.2"
side = "client"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "f037744a79f9982c47876f49c5a3067279f88706"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

# Every tick, on the window's game only: the save's state machine — choose
# the bucket slot, select it a tick ahead (the carried-slot packet must lead
# the use on the wire), use it at the floor the feet' ray finds, and fill the
# bucket back up from the placed water once the landing settled. The
# client_tick_pre hook itself is implemented in src/lib.rs so this dispatch
# always runs.
[[native.mixin]]
id = "tick"
target = "horizon_client::game::native_hooks::client_tick_pre::Game<'_>::native_client_tick_pre"
kind = "HEAD"
helper = "src/mixins/tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]
